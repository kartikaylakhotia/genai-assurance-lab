name: assurance-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm:
        description: "Also run LLM metrics (needs GROQ_API_KEY secret)"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit and data-integrity tests
        run: pytest -q
      - name: Guardrail red-team baseline
        run: python -m redteam.run_guardrail_baseline
      - name: Offline evaluation on RBI corpus
        run: python -m evals.run_eval
      - name: LLM evaluation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_llm }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run_eval --llm
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
